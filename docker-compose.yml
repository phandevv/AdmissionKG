version: '3.8'

services:
  # ────────────────────────────────────────────────
  # PostgreSQL - Relational Database
  # ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: admissions_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admissions_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-admissions_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ────────────────────────────────────────────────
  # Backend - Spring Boot API
  # ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admissions_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      BACKEND_PORT: 8080
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-admissions_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Neo4j Aura Cloud
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # DeepSeek LLM API
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-admissionkg-secret-key-at-least-32-chars-long-here}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # CORS - allow browser access from host machine ports 3001/3000 and direct
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000,http://localhost,http://127.0.0.1:3001,http://admissions_frontend:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  # ────────────────────────────────────────────────
  # Frontend - React + Nginx
  # ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admissions_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

# ────────────────────────────────────────────────
# Volumes & Networks
# ────────────────────────────────────────────────
volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
